<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Client-Side Audio Compressor</title>
  <!-- Streamlit Component Library -->
  <script src="https://cdn.jsdelivr.net/npm/streamlit-component-lib@1.4.0/dist/streamlit-component-lib.js"></script>
  <!-- Pure JS MP3 Encoder -->
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: transparent; color: #f3f4f6; margin: 0; padding: 4px; overflow: hidden; }
    
    .compressor-card {
      background: rgba(31, 41, 55, 0.7);
      border: 1.5px dashed #4b5563;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      transition: all 0.25s ease;
      cursor: pointer;
      position: relative;
    }
    .compressor-card:hover, .compressor-card.dragover {
      border-color: #ff4b4b;
      background: rgba(45, 55, 72, 0.85);
      box-shadow: 0 0 15px rgba(255, 75, 75, 0.25);
    }
    .icon { font-size: 2.2rem; margin-bottom: 8px; }
    .title { font-weight: 700; font-size: 1.05rem; color: #ffffff; }
    .subtitle { font-size: 0.85rem; color: #9ca3af; margin-top: 4px; }
    
    .badge-device {
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      margin-top: 8px;
    }
    
    #file-input { display: none; }
    
    .progress-wrapper {
      display: none;
      text-align: left;
      padding: 10px 0;
    }
    .status-text {
      font-size: 0.88rem;
      font-weight: 600;
      color: #f3f4f6;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .progress-bar-container {
      width: 100%;
      height: 10px;
      background: #374151;
      border-radius: 6px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff4b4b, #ff8c42);
      transition: width 0.2s ease-out;
    }

    .success-box {
      display: none;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
      text-align: left;
    }
    .success-header {
      font-weight: 700;
      color: #34d399;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stats-row {
      display: flex;
      gap: 16px;
      margin-top: 8px;
      font-size: 0.85rem;
      color: #d1d5db;
    }
    .stat-pill {
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 10px;
      border-radius: 6px;
    }
    .btn-reset {
      background: transparent;
      border: 1px solid #6b7280;
      color: #9ca3af;
      font-size: 0.78rem;
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
    }
    .btn-reset:hover { border-color: #ff4b4b; color: #ff4b4b; }
    
    .error-box {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div id="dropzone" class="compressor-card">
    <div class="icon">⚡</div>
    <div class="title">Choose or Drop ANY Audio/Video File</div>
    <div class="subtitle">Supports MP3, MP4, WAV, M4A, MOV, FLAC, OGG, MKV • <strong>No Size Limit</strong></div>
    <div>
      <span class="badge-device">🔒 100% In-Browser Device Compression (0% Server RAM)</span>
    </div>
    <input type="file" id="file-input" accept="audio/*,video/*">
  </div>

  <div id="progress-wrapper" class="progress-wrapper">
    <div class="status-text">
      <span id="status-message">⚡ Compressing locally on your device...</span>
      <span id="status-percent">0%</span>
    </div>
    <div class="progress-bar-container">
      <div id="progress-fill" class="progress-bar-fill"></div>
    </div>
  </div>

  <div id="success-box" class="success-box">
    <div class="success-header">
      <span>✅ File Compressed Successfully on Device!</span>
    </div>
    <div class="stats-row">
      <div class="stat-pill">📁 Original: <strong id="orig-size">-</strong></div>
      <div class="stat-pill">⚡ Compressed: <strong id="comp-size" style="color:#34d399;">-</strong></div>
      <div class="stat-pill">🚀 Reduction: <strong id="reduction-pct" style="color:#60a5fa;">-</strong></div>
    </div>
    <button id="btn-reset" class="btn-reset">🔄 Compress Another File</button>
  </div>

  <div id="error-box" class="error-box"></div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const progressWrapper = document.getElementById('progress-wrapper');
    const progressFill = document.getElementById('progress-fill');
    const statusMessage = document.getElementById('status-message');
    const statusPercent = document.getElementById('status-percent');
    const successBox = document.getElementById('success-box');
    const errorBox = document.getElementById('error-box');
    const origSizeEl = document.getElementById('orig-size');
    const compSizeEl = document.getElementById('comp-size');
    const reductionPctEl = document.getElementById('reduction-pct');
    const btnReset = document.getElementById('btn-reset');

    function notifyHeight() {
      if (window.Streamlit) {
        window.Streamlit.setFrameHeight(document.body.scrollHeight + 10);
      }
    }

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    btnReset.addEventListener('click', () => {
      dropzone.style.display = 'block';
      successBox.style.display = 'none';
      progressWrapper.style.display = 'none';
      errorBox.style.display = 'none';
      fileInput.value = '';
      if (window.Streamlit) {
        window.Streamlit.setComponentValue(null);
      }
      notifyHeight();
    });

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function updateProgress(pct, msg) {
      progressFill.style.width = pct + '%';
      statusPercent.innerText = Math.round(pct) + '%';
      if (msg) statusMessage.innerText = msg;
    }

    async function handleFile(file) {
      errorBox.style.display = 'none';
      dropzone.style.display = 'none';
      progressWrapper.style.display = 'block';
      notifyHeight();

      try {
        updateProgress(5, `Reading '${file.name}' (${formatBytes(file.size)})...`);

        const arrayBuffer = await file.arrayBuffer();
        updateProgress(20, 'Decoding audio track on device...');

        const targetSampleRate = 16000;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        let audioBuffer;
        try {
          audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        } catch (decErr) {
          throw new Error("Could not decode audio track. The file format or codec may be unsupported by your browser.");
        }

        updateProgress(45, 'Resampling to Mono 16kHz audio...');

        const offlineCtx = new OfflineAudioContext(1, Math.ceil(audioBuffer.duration * targetSampleRate), targetSampleRate);
        const source = offlineCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(offlineCtx.destination);
        source.start(0);

        const resampledBuffer = await offlineCtx.startRendering();
        const pcmData = resampledBuffer.getChannelData(0);

        updateProgress(65, 'Compressing to 32 kbps Mono MP3 on device...');

        // Convert Float32 [-1.0, 1.0] to Int16 [-32768, 32767]
        const samples = new Int16Array(pcmData.length);
        for (let i = 0; i < pcmData.length; i++) {
          let s = Math.max(-1, Math.min(1, pcmData[i]));
          samples[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }

        let mp3Blob;
        if (typeof lamejs !== 'undefined' && lamejs.Mp3Encoder) {
          const mp3encoder = new lamejs.Mp3Encoder(1, targetSampleRate, 32);
          const mp3Data = [];
          const sampleBlockSize = 1152;

          for (let i = 0; i < samples.length; i += sampleBlockSize) {
            const sampleChunk = samples.subarray(i, i + sampleBlockSize);
            const mp3buf = mp3encoder.encodeBuffer(sampleChunk);
            if (mp3buf.length > 0) {
              mp3Data.push(mp3buf);
            }

            if (i % (sampleBlockSize * 200) === 0) {
              const pct = 65 + Math.floor((i / samples.length) * 30);
              updateProgress(pct, `Compressing MP3 on device (${pct}%)...`);
              await new Promise(r => setTimeout(r, 0));
            }
          }

          const mp3buf = mp3encoder.flush();
          if (mp3buf.length > 0) {
            mp3Data.push(mp3buf);
          }

          mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
        } else {
          // Fallback to Mono 16kHz WAV blob if lamejs is unavailable
          mp3Blob = createWavBlob(samples, targetSampleRate);
        }

        updateProgress(98, 'Preparing compressed file...');

        const reader = new FileReader();
        reader.onloadend = function () {
          const base64data = reader.result.split(',')[1];
          const compressedSize = mp3Blob.size;
          const origSize = file.size;
          const pctSaved = Math.max(0, ((origSize - compressedSize) / origSize) * 100).toFixed(1);

          origSizeEl.innerText = formatBytes(origSize);
          compSizeEl.innerText = formatBytes(compressedSize);
          reductionPctEl.innerText = `${pctSaved}% smaller`;

          progressWrapper.style.display = 'none';
          successBox.style.display = 'block';
          notifyHeight();

          const baseName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
          const outName = `${baseName}_compressed.mp3`;

          if (window.Streamlit) {
            window.Streamlit.setComponentValue({
              name: outName,
              originalName: file.name,
              originalSizeMb: (origSize / (1024 * 1024)).toFixed(1),
              compressedSizeMb: (compressedSize / (1024 * 1024)).toFixed(1),
              base64: base64data,
              durationSec: Math.round(audioBuffer.duration)
            });
          }
        };
        reader.readAsDataURL(mp3Blob);

      } catch (err) {
        progressWrapper.style.display = 'none';
        dropzone.style.display = 'block';
        errorBox.innerText = `⚠️ Device Compression Error: ${err.message}`;
        errorBox.style.display = 'block';
        notifyHeight();
      }
    }

    function createWavBlob(samples, sampleRate) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);

      function writeString(offset, string) {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM
      view.setUint16(22, 1, true); // Mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, samples.length * 2, true);

      let offset = 44;
      for (let i = 0; i < samples.length; i++, offset += 2) {
        view.setInt16(offset, samples[i], true);
      }
      return new Blob([buffer], { type: 'audio/wav' });
    }

    if (window.Streamlit) {
      window.Streamlit.init();
      notifyHeight();
    }
  </script>
</body>
</html>
